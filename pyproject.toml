[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sidhu-ai"
version = "0.1.0"
description = "Local-first Windows voice assistant MVP"
requires-python = ">=3.11,<3.14"
dependencies = ["psutil>=6,<8", "httpx>=0.27,<1"]

[project.optional-dependencies]
desktop = ["PySide6>=6.7,<7", "sounddevice>=0.5,<1", "vosk>=0.3.45,<0.4", "pyttsx3>=2.98,<3", "pycaw>=20240210; sys_platform == 'win32'"]
documents = ["pypdf>=5,<7"]
browser = ["playwright>=1.48,<2"]
dev = ["pytest>=8,<9", "pyinstaller>=6,<7"]

[project.scripts]
sidhu-ai = "sidhu.app:main"

[tool.setuptools.packages.find]
include = ["sidhu*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
sidhu = ["assets/*.qml"]
